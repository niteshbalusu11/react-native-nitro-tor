name: Release Package

on:
  push:
    tags:
      - "v*" # Trigger on tags like v1.0.0

jobs:
  build_android:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build example Android app
        run: yarn example build:android

  build_ios:
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install CocoaPods dependencies
        run: yarn example ios:prebuild

      - name: Build example iOS app
        run: yarn example build:ios:xcode

  publish_npm_and_github_release:
    runs-on: ubuntu-latest
    needs:
      - build_android
      - build_ios
    permissions:
      contents: write # Required to create a release and upload assets
      id-token: write # Required for npm publish
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Prepare package for release
        run: yarn tsdown

      - name: Publish to npm
        run: npm publish

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} --generate-notes
