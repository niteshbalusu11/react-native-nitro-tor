[package]
name = "libtor-sys"
version = "49.11.0+0.4.9.11"
publish = false
edition = "2021"
license = "MIT"
build = "build.rs"
links = "tor"

[dependencies]
openssl-sys = "0.9"
libz-sys = { version = "1.1.21", features = ["static"] }
lzma-sys = { version = "0.1.20", optional = true }
zstd-sys = { version = "2.0.13", optional = true }

[build-dependencies]
cc = "1.0"
autotools = "^0.2.2"
fs_extra = "1.3.0"

[lib]
name = "tor_sys"
path = "src/lib.rs"

[features]
vendored-openssl = ["openssl-sys/vendored"]
vendored-lzma = ["lzma-sys", "lzma-sys/static", "with-lzma"]
vendored-zstd = ["zstd-sys", "with-zstd"]
with-lzma = []
with-zstd = []
