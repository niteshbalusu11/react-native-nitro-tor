[package]
name = "react_native_nitro_tor"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.99"
craby = "0.1.0-rc.3"
cxx = { version = "1.0.190", features = ["c++17"] }
tor = { git = "https://github.com/niteshbalusu11/tor-rust-sdk", branch = "socks5h-support" }
logger = { git = "https://github.com/niteshbalusu11/tor-rust-sdk", branch = "socks5h-support" }
once_cell = "1.20.3"
serde = { version="1.0.217", features = ["derive"], default-features = false }
serde_json = "1.0.138"

[build-dependencies]
craby_build = { version = "0.1.0-rc.3", features = ["cxx"] }

[lib]
name = "reactnativenitrotor"
crate-type = ["staticlib"]
